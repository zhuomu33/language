const lessons={de:{name:'德语',native:'DEUTSCH',level:'A1 → B1',title:'Ein Morgen in den Bergen',subtitle:'山间的一个清晨',category:'生活故事',time:'约 15 分钟',lang:'de-DE',voice:'标准德语',words:'126',sentences:['Heute steht Lena früh auf.','Sie wohnt in einem kleinen Dorf in den Bergen.','Am Morgen öffnet sie das Fenster. Die Luft ist frisch.','Nach dem Frühstück geht sie nach draußen.','Sie nimmt ihren Rucksack mit und geht zum See.','Am See sitzt sie auf einer Bank. Sie hört die Vögel und trinkt einen Tee.','Heute hat Lena Zeit. Sie bleibt noch ein bisschen.'],marked:{1:'Bergen',2:'frisch',4:'Rucksack'},word:{Bergen:['der Berg · 名词 · 阳性','/bɛʁk/','山；这里的 den Bergen 是复数第三格。','复数：die Berge','Die Berge sind sehr schön.','这些山很美。'],frisch:['形容词','/fʁɪʃ/','清新的；这里指空气清新。','原形：frisch','Die Luft ist frisch.','空气很清新。'],Rucksack:['der Rucksack · 名词 · 阳性','/ˈʁʊkzak/','背包；句中是第四格宾语。','复数：die Rucksäcke','Mein Rucksack ist klein.','我的背包很小。']}},en:{name:'英语',native:'ENGLISH',level:'B2 → C1',title:'The Quiet Value of Urban Trees',subtitle:'城市树木，安静而重要的存在',category:'环境与生活',time:'约 15 分钟',lang:'en-GB',voice:'英式英语',words:'142',sentences:['A city can feel entirely different beneath a canopy of trees.','Beyond their obvious beauty, urban trees provide something increasingly scarce: a place to slow down.','Their shade makes a crowded pavement feel more welcoming, while their leaves soften the outline of buildings.','Yet a greener city does not appear overnight. It requires patience, careful planning and sustained attention.','Planting a tree is only the beginning; keeping it healthy is a commitment that extends across generations.','Perhaps the most valuable thing trees offer is a reminder that progress need not always be immediate.'],marked:{0:'canopy',1:'scarce',3:'sustained'},word:{canopy:['noun · 名词','/ˈkænəpi/','树冠层；这里指树木形成的遮蔽空间。','复数：canopies','We walked beneath the leafy canopy.','我们在枝叶形成的树荫下行走。'],scarce:['adjective · 形容词','/skeəs/','稀缺的；这里形容可以放慢节奏的空间越来越少。','搭配：increasingly scarce','Quiet spaces are scarce in the city.','城市里安静的空间很少。'],sustained:['adjective · 形容词','/səˈsteɪnd/','持续的；强调关注需要长期维持。','词源：sustain','The project needs sustained attention.','这个项目需要持续关注。']}}};
let page='home',language='de',saved=new Map(JSON.parse(localStorage.getItem('daily-page-vocab')||'[]')),playing=false,sentenceIndex=0,toastTimer,activeTab='structure';
const navItems=[['home','house','今日'],['vocabulary','bookmark','生词'],['settings','sliders-horizontal','设置']];

function navigation(){const html=navItems.map(([id,ico,label])=>`<button data-nav="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(ico)}<span>${label}${id==='vocabulary'&&saved.size?' · '+saved.size:''}</span></button>`).join('');$('.nav').innerHTML=html;$('.mobile-nav').innerHTML=html;$('.mobile-nav').classList.toggle('hidden',page==='reader');$('#audio').classList.toggle('hidden',page!=='reader')}

const originalWords={de:{...lessons.de.word},en:{...lessons.en.word}};
function makeWordsClickable(){
  const l=lessons[language],segmenter=new Intl.Segmenter(l.lang,{granularity:'word'});
  document.querySelectorAll('.sentence-row').forEach(row=>{
    const container=row.querySelector('span'),index=Number(row.dataset.sentence);
    container.replaceChildren(...Array.from(segmenter.segment(l.sentences[index]),part=>{
      if(!part.isWordLike)return document.createTextNode(part.segment);
      const button=document.createElement('button');
      button.className='word'+(part.segment===l.marked[index]?'':' plain');
      button.textContent=part.segment;button.dataset.word=part.segment;button.dataset.context=index;
      button.setAttribute('aria-label','解释 '+part.segment);
      return button;
    }));
  });
}
function prepareWord(word,index){
  const l=lessons[language];
  if(originalWords[language][word])return;
  let meaning=previewMeanings[language][word.toLocaleLowerCase(l.lang)];
  if(language==='de'&&word.toLowerCase()==='auf'&&index===5)meaning='在……上；这里 auf einer Bank 表示静态位置，后接第三格';
  if(language==='de'&&word.toLowerCase()==='nach')meaning=index===3?'在……之后；Nach dem Frühstück 表示早餐后，后接第三格':'向；nach draußen 表示到外面去';
  if(language==='en'&&word.toLowerCase()==='it')meaning=index===3?'它；这里指建设一个绿化更好的城市':'它；这里指前文的树';
  if(language==='en'&&word.toLowerCase()==='that')meaning=index===4?'关系代词；引导定语从句，修饰 commitment':'连接词；引导同位语从句，说明 reminder 的内容';
  if(typeof courseProgress!=='undefined'&&courseProgress[language].index===1){
    meaning=nextLessons[language].meanings[word.toLocaleLowerCase(l.lang)]||previewMeanings[language][word.toLocaleLowerCase(l.lang)];
    if(language==='de'&&word.toLowerCase()==='auf')meaning='在……上；表示静态位置，后接第三格';
    if(language==='de'&&word.toLowerCase()==='ein'&&index===5)meaning='ein bisschen 表示一点儿，这里指一会儿';
    if(language==='en'&&word.toLowerCase()==='it')meaning='它；这里指社区花园';
  }
  const translation=(language==='de'?deNotes:enNotes)[index][0];
  l.word[word]=['当前语境','',meaning||'这篇示例暂未提供该词的释义。','',l.sentences[index],translation];
}

let analyzed=0;
function analysis(i,tab='structure'){analyzed=i;activeTab=tab;const l=lessons[language],n=language==='de'?deNotes[i]:enNotes[i];let content='';if(tab==='structure'){content=language==='de'&&i===0&&lessons[language].title==='Ein Morgen in den Bergen'?`<div class="structure"><div class="part">Heute<small>① 时间状语</small></div><div class="part">steht<small>② 变位动词</small></div><div class="part">Lena<small>主语</small></div><div class="part">früh auf<small>时间 + 动词前缀</small></div></div><div class="explain"><strong>为什么是这个顺序？</strong><p>${n[2]}</p><div class="note"><strong>Heute</strong> | <strong>steht</strong> | Lena früh | <strong>auf.</strong><br>第一位可以变化，变位动词仍在第二位。</div></div>`:`<div class="explain"><strong>${language==='de'?'理解这句话的结构':'Sentence structure'}</strong><p>${language==='de'?n[2]:n[1]}</p></div>`}else if(tab==='examples'){content=`<div class="example" style="border:0;margin:0;padding:0"><small class="muted">相同结构，再读一句</small><p>${language==='de'?n[3]:(n[2]||'A familiar street can feel entirely different in the rain.')}</p><div class="translation">${language==='de'?n[4]:(n[3]||'一条熟悉的街道，在雨中可能让人感觉截然不同。')}</div></div>`}else{content=`<div class="explain"><strong>这句话的学习重点</strong><p>${language==='de'?n[2]:n[1]}</p><div class="note">${language==='de'?'先找变位动词，再找主语，最后理解时间、地点和其他成分。':'先找到主句，再理解修饰语如何补充信息。'}</div></div>`}openSheet('句子解析',`<small class="muted">${l.native} · 第 ${i+1} 句</small><div class="quote">${l.sentences[i]}</div><p class="translation">${n[0]}</p><div class="analysis-tabs" role="tablist">${[['structure','句子结构'],['examples','同类例句'],['notes','学习重点']].map(([t,label])=>`<button role="tab" aria-selected="${tab===t}" data-tab="${t}" class="${tab===t?'active':''}">${label}</button>`).join('')}</div>${content}<div class="sheet-bottom"><button class="secondary" data-speak-sentence="${i}">${icon('volume-2')}听这句话</button><button class="primary" data-next-analysis="${(i+1)%l.sentences.length}">下一句 ${icon('arrow-right')}</button></div>`)}
function practice(){if(typeof courseProgress!=='undefined'&&courseProgress[language].index===1){const l=nextLessons[language];openSheet('阅读理解',`<h2>${l.question}</h2>${l.choices.map((s,i)=>`<button class="question-choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${s}</button>`).join('')}<div id="feedback" class="feedback" role="status"></div>`);return;}openSheet('阅读理解',`<div class="eyebrow">CHECK YOUR UNDERSTANDING</div><h2>${language==='de'?'Lena geht nach dem Frühstück ...':'What does the article emphasise about urban trees?'}</h2><div style="margin-top:20px">${(language==='de'?['nach draußen.','zur Arbeit.','ins Kino.']:['They require long-term care.','They grow fully overnight.','They only improve appearance.']).map((s,i)=>`<button class="question-choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${s}</button>`).join('')}</div><div id="feedback" class="feedback" role="status"></div>`)}
function stopAudio(){if('speechSynthesis'in window)speechSynthesis.cancel();playing=false;document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking'));$('#play').innerHTML=icon('play');$('#play').setAttribute('aria-label','播放文章');icons()}
function speak(text,onend){if(!('speechSynthesis'in window)){toast('当前浏览器不支持语音播放');return}const l=lessons[language],u=new SpeechSynthesisUtterance(text);u.lang=l.lang;u.rate=Number($('#speed').value);const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()===l.lang.toLowerCase());if(!voice){toast('设备尚未提供对应语言的语音，请安装系统语音后试听');stopAudio();return}u.voice=voice;u.onend=()=>{if(onend)onend();else stopAudio()};u.onerror=()=>{stopAudio();toast('语音未能播放，请检查系统语音设置')};speechSynthesis.speak(u)}
function playSentence(i,continuous=false){stopAudio();sentenceIndex=i;playing=true;$('#play').innerHTML=icon('square');$('#play').setAttribute('aria-label','停止播放');const row=$(`[data-sentence="${i}"]`);if(row)row.classList.add('speaking');$('#audio-label').textContent=lessons[language].voice+' · 第 '+(i+1)+' 句';$('#audio-progress').style.width=((i+1)/lessons[language].sentences.length*100)+'%';icons();speak(lessons[language].sentences[i],()=>{if(continuous&&i+1<lessons[language].sentences.length)playSentence(i+1,true);else stopAudio()})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.read){language=b.dataset.read;sentenceIndex=0;go('reader');return}if(b.dataset.word){prepareWord(b.dataset.word,Number(b.dataset.context));wordSheet(b.dataset.word);return}if(b.dataset.analyze!==undefined){analysis(Number(b.dataset.analyze));return}if(b.dataset.tab){analysis(analyzed,b.dataset.tab);return}if(b.dataset.nextAnalysis!==undefined){analysis(Number(b.dataset.nextAnalysis));return}if(b.dataset.speakSentence!==undefined){playSentence(Number(b.dataset.speakSentence));return}if(b.dataset.speakWord){stopAudio();speak(b.dataset.speakWord);return}if(b.dataset.known){saved.delete(language+':'+b.dataset.known);$('#sheet').close();navigation();icons();toast('已从生词中移除');return}if(b.dataset.remove){saved.delete(b.dataset.remove);render();return}if(b.dataset.answer!==undefined){document.querySelectorAll('.question-choice').forEach(c=>c.classList.toggle('selected',c===b));$('#feedback').textContent=b.dataset.answer==='0'?'回答正确。你抓住了文章的关键信息。':'再想一想，也可以回到文章中找找线索。';return}if(b.id==='practice'){practice();return}}
const s=e.target.closest('.sentence-row');if(s)analysis(Number(s.dataset.sentence))});
document.addEventListener('change',e=>{if(e.target.dataset.setting){if(e.target.checkValidity()){settingValues[e.target.dataset.setting]=e.target.value;persist();toast('已更新本次预览的设置')}else e.target.reportValidity()}});
document.addEventListener('click',e=>{const button=e.target.closest('[data-play-sentence]');if(button){e.stopPropagation();playSentence(Number(button.dataset.playSentence));return}} ,true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.word){const item=saved.get(language+':'+b.dataset.word);if(item)item.definition=lessons[language].word[b.dataset.word]?.[2];}if(b&&(b.dataset.word||b.dataset.known||b.dataset.remove))setTimeout(persist,0)});
$('#close-sheet').onclick=()=>$('#sheet').close();$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=$('#sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#sheet').close()}});$('#play').onclick=()=>playing?stopAudio():playSentence(sentenceIndex,true);$('#audio-next').onclick=()=>playSentence((sentenceIndex+1)%lessons[language].sentences.length);$('#speed').onchange=()=>{if(playing)playSentence(sentenceIndex,true)};
$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
<script src="course-progress.js"></script>
</body>
</html>
