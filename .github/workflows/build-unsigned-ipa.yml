name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build:web:ci
      - name: Verify web release
        run: |
          node verify-release.mjs
          npm test
      - name: Create iOS project
        run: npx cap add ios
      - name: Sync web assets
        run: npx cap sync ios
      - name: Verify iOS workspace
        run: test -d ios/App/App.xcworkspace
      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION=0.3.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          cp PrivacyInfo.xcprivacy Payload/App.app/PrivacyInfo.xcprivacy
          zip -r daily-page.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: daily-page-ipa
          path: daily-page.ipa
          retention-days: 3
          if-no-files-found: error
